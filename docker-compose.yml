# Postgres for local development. No need to install PostgreSQL.
# Host port is read from POSTGRES_PORT in .env (default 5432). Start: npm run db:up
services:
  postgres:
    image: postgres:16
    container_name: unified-creator-stats-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unified_creator_stats
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unified_creator_stats"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
